name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml openpyxl numpy matplotlib

      - name: Run tests not requiring external bioinformatics executables
        run: |
          pytest -q

      - name: Python syntax check
        run: python -m compileall -q scripts tests

      - name: Shell syntax check
        run: |
          for shell_file in scripts/*.sh scripts/lib/*.sh scripts/optional/*.sh; do
            bash -n "$shell_file"
          done
